name: CI

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3-pip
      - run: pip3 install ruff --break-system-packages
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3-pip
      - run: pip3 install -r requirements.txt pytest httpx --break-system-packages
      - name: Run tests
        run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: .

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t task-tracker .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: build production image
        run: docker build -t task-tracker:latest .
      - name: Deploy with OpenTofu
        run: |
          cd terraform
          tofu init
          tofu apply -auto-approve